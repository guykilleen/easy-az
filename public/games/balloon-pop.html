<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Balloon Pop – by Lil</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }

    canvas { display: block; }

    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.88);
      z-index: 10;
    }
    .overlay.hidden { display: none; }

    .overlay h1 {
      font-size: 3.5rem;
      color: #ff6ec7;
      text-shadow: 0 0 20px #ff6ec7, 0 0 50px #ff3aaa;
      letter-spacing: 0.1em;
      margin-bottom: 0.2em;
    }
    .overlay .subtitle {
      color: #aaa;
      font-size: 1rem;
      margin-bottom: 0.4em;
      letter-spacing: 0.2em;
    }
    .overlay .by {
      color: #555;
      font-size: 0.8rem;
      margin-bottom: 2.5em;
    }

    .big-btn {
      background: #ff6ec7;
      color: #1a0010;
      border: none;
      padding: 0.75em 2.8em;
      font-size: 1.3rem;
      font-family: inherit;
      font-weight: bold;
      letter-spacing: 0.12em;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 24px #ff6ec799;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .big-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 40px #ff6ec7cc;
    }

    .controls-hint {
      margin-top: 2em;
      color: #666;
      font-size: 0.82rem;
      text-align: center;
      line-height: 2.2;
    }
    .controls-hint span {
      color: #ff6ec7;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="overlay" id="startScreen">
  <h1>🎈 BALLOON POP</h1>
  <div class="subtitle">AIM · DROP · POP</div>
  <div class="by">by Lil &nbsp;·&nbsp; ez-az.net</div>
  <button class="big-btn" id="startBtn">▶ &nbsp;PLAY</button>
  <div class="controls-hint">
    <span>← →</span> slide the pin left and right<br>
    <span>↓</span> release the pin to pop a balloon<br>
    Don't let the balloons reach the top!
  </div>
</div>

<div class="overlay hidden" id="gameOverScreen">
  <h1 style="font-size:2.8rem; color:#ff6ec7; margin-bottom:0.15em;">💨 TOO MANY ESCAPED!</h1>
  <div class="subtitle">GAME OVER</div>
  <div class="by">by Lil &nbsp;·&nbsp; ez-az.net</div>
  <div id="finalScore" style="color:#ff6ec7;font-size:2.4rem;font-weight:bold;margin-bottom:0.2em;letter-spacing:0.12em;text-shadow:0 0 16px #ff6ec7;"></div>
  <div id="finalWave"  style="color:#aa88cc;font-size:1rem;margin-bottom:0.3em;letter-spacing:0.15em;"></div>
  <div id="bestScore"  style="color:#555;font-size:0.85rem;margin-bottom:2em;letter-spacing:0.1em;"></div>
  <button class="big-btn" id="restartBtn">▶ &nbsp;PLAY AGAIN</button>
</div>

<canvas id="gameCanvas" width="700" height="800"></canvas>

<script>
// ═══════════════════════════════════════
//  SETUP
// ═══════════════════════════════════════
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');
const W = 700, H = 800;

// ═══════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════
const PIN_REST_Y   = 55;    // y of pin tip when resting on the rail
const PIN_SPEED    = 320;   // px/s left-right
const PIN_DROP_SPD = 800;   // px/s downward when fired
const PIN_RETURN_SPD = 1200;// px/s when snapping back
const BALLOON_RISE = 48;    // px/s upward
const SPAWN_EVERY  = 2.0;   // seconds

const COLOURS = [
  '#ff4444','#ff8c00','#ffe033',
  '#44dd44','#44aaff','#cc44ff',
  '#ff6ec7','#00e5cc'
];

const MAX_LIVES  = 5;
const DANGER_Y   = 140;
const PU_FREEZE    = 'freeze';
const PU_SPEED     = 'speed';
const PU_MULTIPIN  = 'multipin';
const PU_CHANCE    = 0.20;   // slightly higher to include the new one

// spacing between the 4 pins in multipin mode
const MULTIPIN_GAP = 60;

// ═══════════════════════════════════════
//  STATE
// ═══════════════════════════════════════
const keys = {};

const pin = {
  x: W / 2,
  y: PIN_REST_Y,
  dropping:  false,
  returning: false,
};

let balloons     = [];
let running      = false;
let lastTime     = 0;
let spawnTimer   = 1.0;
let score        = 0;
let lives        = MAX_LIVES;
let wave         = 1;
let popsThisWave = 0;
let freezeTimer  = 0;
let speedTimer   = 0;
let multipinTimer = 0;  // seconds remaining on multi-pin power-up
// extra pins fired during multipin mode (each: { x, y, dropping, returning })
let extraPins    = [];
let puBanner     = null;
let particles    = [];   // pop confetti particles
let screenShake  = 0;    // seconds of shake remaining
let combo        = 0;    // consecutive pops without missing
let comboTimer   = 0;    // resets combo if no pop in time
let comboDisplay = null; // { val, x, y, timer } – floating combo text
let bgHue        = 260;  // animated background hue (shifts with wave)

// ═══════════════════════════════════════
//  AUDIO  (Web Audio API — all procedural)
// ═══════════════════════════════════════
let audioCtx = null;

// Lazily create AudioContext on first user interaction
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// ── master gain (easy global volume knob) ──
function masterGain() {
  const g = getAudio().createGain();
  g.gain.value = 0.18;
  g.connect(getAudio().destination);
  return g;
}

// POP — short punchy noise burst + pitched blip
function soundPop(colour) {
  const ac  = getAudio();
  const now = ac.currentTime;
  const out = masterGain();

  // white noise burst
  const bufLen = ac.sampleRate * 0.08;
  const buf    = ac.createBuffer(1, bufLen, ac.sampleRate);
  const data   = buf.getChannelData(0);
  for (let i = 0; i < bufLen; i++) data[i] = (Math.random() * 2 - 1);
  const noise  = ac.createBufferSource();
  noise.buffer = buf;
  const noiseFilter = ac.createBiquadFilter();
  noiseFilter.type      = 'bandpass';
  noiseFilter.frequency.value = 800 + Math.random() * 600;
  noiseFilter.Q.value   = 1.2;
  const noiseGain = ac.createGain();
  noiseGain.gain.setValueAtTime(1, now);
  noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.10);
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseGain);
  noiseGain.connect(out);
  noise.start(now);
  noise.stop(now + 0.10);

  // pitched blip — frequency varies by balloon colour
  const freqMap = {
    '#ff4444':330,'#ff8c00':370,'#ffe033':415,'#44dd44':494,
    '#44aaff':523,'#cc44ff':587,'#ff6ec7':659,'#00e5cc':698,
    '#aaeeff':880,'#ffee44':740,'#cc88ff':622,
  };
  const freq = freqMap[colour] || 440;
  const osc  = ac.createOscillator();
  osc.type   = 'square';
  osc.frequency.setValueAtTime(freq * 1.5, now);
  osc.frequency.exponentialRampToValueAtTime(freq * 0.5, now + 0.08);
  const oscGain = ac.createGain();
  oscGain.gain.setValueAtTime(0.4, now);
  oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
  osc.connect(oscGain);
  oscGain.connect(out);
  osc.start(now);
  osc.stop(now + 0.08);
}

// FIRE — quick whoosh as pin drops
function soundFire() {
  const ac  = getAudio();
  const now = ac.currentTime;
  const out = masterGain();

  const osc = ac.createOscillator();
  osc.type  = 'sawtooth';
  osc.frequency.setValueAtTime(900, now);
  osc.frequency.exponentialRampToValueAtTime(180, now + 0.12);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.5, now);
  g.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
  osc.connect(g); g.connect(out);
  osc.start(now); osc.stop(now + 0.12);
}

// ESCAPE — low thud when a balloon gets past
function soundEscape() {
  const ac  = getAudio();
  const now = ac.currentTime;
  const out = masterGain();

  const osc = ac.createOscillator();
  osc.type  = 'sine';
  osc.frequency.setValueAtTime(120, now);
  osc.frequency.exponentialRampToValueAtTime(55, now + 0.22);
  const g = ac.createGain();
  g.gain.setValueAtTime(1.0, now);
  g.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
  osc.connect(g); g.connect(out);
  osc.start(now); osc.stop(now + 0.22);
}

// POWER-UP COLLECT — ascending sparkle arpeggio
function soundPowerUp(type) {
  const ac  = getAudio();
  const now = ac.currentTime;
  const out = masterGain();

  const freqs = type === PU_FREEZE   ? [523, 659, 784, 1047] :
                type === PU_SPEED    ? [440, 554, 659, 880]  :
                                       [370, 494, 622, 740];  // multipin
  freqs.forEach((f, i) => {
    const osc = ac.createOscillator();
    osc.type  = 'triangle';
    osc.frequency.value = f;
    const g = ac.createGain();
    const t = now + i * 0.07;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.6, t + 0.04);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    osc.connect(g); g.connect(out);
    osc.start(t); osc.stop(t + 0.18);
  });
}

// GAME OVER — descending sad trombone-ish
function soundGameOver() {
  const ac  = getAudio();
  const now = ac.currentTime;
  const out = masterGain();

  const notes = [392, 349, 311, 233];
  notes.forEach((f, i) => {
    const osc  = ac.createOscillator();
    osc.type   = 'sawtooth';
    osc.frequency.value = f;
    const g = ac.createGain();
    const t = now + i * 0.18;
    g.gain.setValueAtTime(0.5, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
    osc.connect(g); g.connect(out);
    osc.start(t); osc.stop(t + 0.28);
  });
}

// WAVE UP — quick fanfare blip
function soundWaveUp() {
  const ac  = getAudio();
  const now = ac.currentTime;
  const out = masterGain();

  [523, 659, 784].forEach((f, i) => {
    const osc = ac.createOscillator();
    osc.type  = 'square';
    osc.frequency.value = f;
    const g = ac.createGain();
    const t = now + i * 0.06;
    g.gain.setValueAtTime(0.3, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.10);
    osc.connect(g); g.connect(out);
    osc.start(t); osc.stop(t + 0.10);
  });
}

// ═══════════════════════════════════════
//  BACKGROUND MUSIC
// ═══════════════════════════════════════
/*
 * A looping chiptune built entirely from Web Audio oscillators.
 * Three layers:
 *   1. Bass line  – low square wave, 1 note per beat
 *   2. Melody     – triangle wave arpeggio, 2 notes per beat
 *   3. Hi-hat     – filtered white-noise tick every half-beat
 *
 * The sequencer schedules notes ~0.3 s ahead of playback time
 * using a lookahead scheduler so it stays perfectly in sync.
 */

let music = {
  playing:    false,
  nextBeat:   0,      // audioCtx time of next beat
  beatIndex:  0,      // which beat in the sequence we're on
  tempo:      138,    // BPM — lifted slightly each wave
  scheduler:  null,   // setInterval handle
};

// C major pentatonic notes (Hz) — sounds happy and simple
const SCALE = [261.63, 293.66, 329.63, 392.00, 440.00,
               523.25, 587.33, 659.25, 784.00, 880.00];

// Bass pattern — index into SCALE, one per beat (8-beat loop)
const BASS_PAT  = [0, 0, 2, 2, 4, 4, 2, 0];
// Melody pattern — two notes per beat (16 steps), index into SCALE
const MEL_PAT   = [7, 5, 7, 9, 7, 5, 4, 5, 7, 7, 5, 4, 2, 4, 5, 4];

function scheduleNote(ac, freq, type, vol, start, dur) {
  const osc = ac.createOscillator();
  osc.type  = type;
  osc.frequency.value = freq;
  const g = ac.createGain();
  g.gain.setValueAtTime(vol, start);
  g.gain.setValueAtTime(vol, start + dur * 0.6);
  g.gain.linearRampToValueAtTime(0, start + dur);
  // music bus — quieter than SFX
  const bus = ac.createGain();
  bus.gain.value = 0.10;
  bus.connect(ac.destination);
  osc.connect(g);
  g.connect(bus);
  osc.start(start);
  osc.stop(start + dur + 0.02);
}

function scheduleHihat(ac, start) {
  const bufLen = Math.floor(ac.sampleRate * 0.04);
  const buf    = ac.createBuffer(1, bufLen, ac.sampleRate);
  const data   = buf.getChannelData(0);
  for (let i = 0; i < bufLen; i++) data[i] = Math.random() * 2 - 1;
  const src = ac.createBufferSource();
  src.buffer = buf;
  const filt = ac.createBiquadFilter();
  filt.type  = 'highpass';
  filt.frequency.value = 6000;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.12, start);
  g.gain.exponentialRampToValueAtTime(0.001, start + 0.04);
  const bus = ac.createGain();
  bus.gain.value = 0.10;
  bus.connect(ac.destination);
  src.connect(filt);
  filt.connect(g);
  g.connect(bus);
  src.start(start);
  src.stop(start + 0.05);
}

function musicTick() {
  if (!music.playing) return;
  const ac        = getAudio();
  const lookahead = 0.3;   // schedule this many seconds ahead
  const beatSec   = 60 / music.tempo;
  const halfBeat  = beatSec / 2;

  while (music.nextBeat < ac.currentTime + lookahead) {
    const t  = music.nextBeat;
    const bi = music.beatIndex % 8;
    const mi = music.beatIndex % 16;

    // bass note (one per beat)
    const bassFreq = SCALE[BASS_PAT[bi]] * 0.5; // one octave down
    scheduleNote(ac, bassFreq, 'square', 0.5, t, beatSec * 0.45);

    // melody note 1 (on the beat)
    scheduleNote(ac, SCALE[MEL_PAT[mi]], 'triangle', 0.35, t, halfBeat * 0.8);

    // melody note 2 (half-beat offset)
    const mi2 = (music.beatIndex * 2 + 1) % 16;
    scheduleNote(ac, SCALE[MEL_PAT[mi2]], 'triangle', 0.28, t + halfBeat, halfBeat * 0.8);

    // hi-hat on every half-beat
    scheduleHihat(ac, t);
    scheduleHihat(ac, t + halfBeat);

    // kick on beats 1 and 5 (of the 8-beat bar)
    if (bi === 0 || bi === 4) {
      const kick = ac.createOscillator();
      kick.type  = 'sine';
      kick.frequency.setValueAtTime(140, t);
      kick.frequency.exponentialRampToValueAtTime(40, t + 0.15);
      const kg = ac.createGain();
      kg.gain.setValueAtTime(0.5, t);
      kg.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      const bus = ac.createGain();
      bus.gain.value = 0.10;
      bus.connect(ac.destination);
      kick.connect(kg); kg.connect(bus);
      kick.start(t); kick.stop(t + 0.2);
    }

    music.nextBeat  += beatSec;
    music.beatIndex += 1;
  }
}

function startMusic() {
  if (music.playing) return;
  const ac       = getAudio();
  music.playing  = true;
  music.nextBeat = ac.currentTime + 0.05;
  music.beatIndex = 0;
  music.scheduler = setInterval(musicTick, 50);
}

function stopMusic() {
  music.playing = false;
  if (music.scheduler) { clearInterval(music.scheduler); music.scheduler = null; }
}

// Speed up music tempo each wave
function updateMusicTempo() {
  music.tempo = Math.min(200, 138 + (wave - 1) * 5);
}

// ═══════════════════════════════════════
//  INPUT
// ═══════════════════════════════════════
window.addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowDown'].includes(e.key)) e.preventDefault();
  if (!keys[e.key]) {
    keys[e.key] = true;
    if (e.key === 'ArrowDown' && running && !pin.dropping && !pin.returning) {
      pin.dropping = true;
      soundFire();
      // fire all extra pins simultaneously
      for (const ep of extraPins) {
        if (!ep.dropping && !ep.returning) ep.dropping = true;
      }
    }
  }
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

// ═══════════════════════════════════════
//  BALLOON FACTORY
// ═══════════════════════════════════════
function makeBalloon() {
  const r = 26 + Math.random() * 16;

  // Try up to 20 times to find a position that doesn't overlap any existing balloon
  // and isn't at the same height (y within 2 radii of another)
  let x, y;
  const MIN_GAP = 18; // minimum pixel gap between balloon edges
  for (let attempt = 0; attempt < 20; attempt++) {
    x = r + 20 + Math.random() * (W - (r + 20) * 2);
    y = H + r + 10 + Math.random() * 60; // stagger start heights slightly too

    let clear = true;
    for (const b of balloons) {
      if (b.popping) continue;
      // check horizontal overlap (they share similar y range while rising)
      const dx   = Math.abs(x - b.baseX);
      const minD = r + b.r + MIN_GAP;
      if (dx < minD) { clear = false; break; }
      // check they aren't at the same height
      const dy = Math.abs(y - b.y);
      if (dy < r + b.r + MIN_GAP) { clear = false; break; }
    }
    if (clear) break;
  }

  let powerUp = null;
  const roll = Math.random();
  if      (roll < PU_CHANCE * 0.33) powerUp = PU_FREEZE;
  else if (roll < PU_CHANCE * 0.66) powerUp = PU_SPEED;
  else if (roll < PU_CHANCE)        powerUp = PU_MULTIPIN;

  return {
    x, y,
    baseX: x,
    r,
    colour: powerUp === PU_FREEZE   ? '#aaeeff'
           : powerUp === PU_SPEED    ? '#ffee44'
           : powerUp === PU_MULTIPIN ? '#cc88ff'
           : COLOURS[Math.floor(Math.random() * COLOURS.length)],
    powerUp,
    wobble:      Math.random() * Math.PI * 2,
    wobbleSpeed: 1.0 + Math.random() * 0.8,
    wobbleAmp:   12  + Math.random() * 14,
    popping:  false,
    popTimer: 0,
  };
}

// ═══════════════════════════════════════
//  UPDATE
// ═══════════════════════════════════════
function update(dt) {

  // ── tick power-up timers ──
  if (freezeTimer    > 0) freezeTimer    = Math.max(0, freezeTimer    - dt);
  if (speedTimer     > 0) speedTimer     = Math.max(0, speedTimer     - dt);
  if (multipinTimer  > 0) {
    multipinTimer = Math.max(0, multipinTimer - dt);
    if (multipinTimer === 0) extraPins = [];
  }
  if (puBanner) { puBanner.timer -= dt; if (puBanner.timer <= 0) puBanner = null; }
  if (screenShake > 0) screenShake = Math.max(0, screenShake - dt);
  updateParticles(dt);

  // combo decay
  if (comboTimer > 0) {
    comboTimer -= dt;
    if (comboTimer <= 0) { comboTimer = 0; combo = 0; }
  }
  if (comboDisplay) {
    comboDisplay.timer -= dt;
    comboDisplay.y     -= 30 * dt;
    if (comboDisplay.timer <= 0) comboDisplay = null;
  }

  // slowly shift background hue toward wave target
  const targetHue = 260 + (wave - 1) * 18;
  bgHue += (targetHue - bgHue) * dt * 0.5;

  const currentPinSpeed = PIN_SPEED * (speedTimer > 0 ? 2.2 : 1);

  // ── main pin horizontal movement ──
  if (!pin.dropping && !pin.returning) {
    if (keys['ArrowLeft'])  pin.x -= currentPinSpeed * dt;
    if (keys['ArrowRight']) pin.x += currentPinSpeed * dt;
    pin.x = Math.max(24, Math.min(W - 24, pin.x));
    // extra pins slide with the main pin while resting
    if (multipinTimer > 0) {
      for (let i = 0; i < extraPins.length; i++) {
        extraPins[i].x = pin.x + (i + 1) * MULTIPIN_GAP;
      }
    }
  }

  // helper: try to pop a balloon at pin tip (px, py), returns true if hit
  function tryPopAt(px, py) {
    for (const b of balloons) {
      if (b.popping) continue;
      const dx = px - b.x, dy = py - b.y;
      if (dx*dx + dy*dy <= b.r * b.r) {
        b.popping = true; b.popTimer = 0;
        soundPop(b.colour);
        spawnPopParticles(b.x, b.y, b.colour, !!b.powerUp);
        if (!b.powerUp) {
          combo++;
          comboTimer = 3.0;
          const comboBonus = combo >= 5 ? 3 : combo >= 3 ? 2 : 1;
          const pts = Math.max(1, Math.round(50 - b.r));
          const total = pts * wave * comboBonus;
          score += total;
          b.scorePopup = { val: total, timer: 0 };
          if (combo >= 3) {
            comboDisplay = { val: combo, x: b.x, y: b.y - b.r - 10, timer: 1.2 };
          }
          popsThisWave++;
          if (popsThisWave >= 5) {
            wave++; popsThisWave = 0;
            soundWaveUp();
            updateMusicTempo();
          }
        } else {
          activatePowerUp(b.powerUp);
        }
        return true;
      }
    }
    return false;
  }

  // ── main pin drop ──
  if (pin.dropping) {
    pin.y += PIN_DROP_SPD * dt;
    if (tryPopAt(pin.x, pin.y) || pin.y >= H - 10) {
      pin.dropping = false; pin.returning = true;
    }
  }

  // ── main pin return ──
  if (pin.returning) {
    pin.y -= PIN_RETURN_SPD * dt;
    if (pin.y <= PIN_REST_Y) { pin.y = PIN_REST_Y; pin.returning = false; }
  }

  // ── extra pins (multipin) ──
  for (const ep of extraPins) {
    if (ep.dropping) {
      ep.y += PIN_DROP_SPD * dt;
      if (tryPopAt(ep.x, ep.y) || ep.y >= H - 10) {
        ep.dropping = false; ep.returning = true;
      }
    }
    if (ep.returning) {
      ep.y -= PIN_RETURN_SPD * dt;
      if (ep.y <= PIN_REST_Y) { ep.y = PIN_REST_Y; ep.returning = false; }
    }
  }

  // ── difficulty ──
  const riseSpeed  = BALLOON_RISE + (wave - 1) * 12;
  const spawnSpeed = Math.max(0.7, SPAWN_EVERY - (wave - 1) * 0.15);

  // ── spawn ──
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    balloons.push(makeBalloon());
    spawnTimer = spawnSpeed;
  }

  // ── move balloons ──
  for (let i = balloons.length - 1; i >= 0; i--) {
    const b = balloons[i];
    if (b.popping) {
      b.popTimer += dt;
      if (b.scorePopup) b.scorePopup.timer += dt;
      if (b.popTimer > 0.28) balloons.splice(i, 1);
      continue;
    }
    if (freezeTimer > 0) continue;
    b.wobble += b.wobbleSpeed * dt;
    b.y      -= riseSpeed * dt;
    b.x       = b.baseX + Math.sin(b.wobble) * b.wobbleAmp;
    if (b.y + b.r < DANGER_Y - 20) {
      balloons.splice(i, 1);
      lives--;
      soundEscape();
      screenShake = 0.25;
      combo = 0; comboTimer = 0;
      if (lives <= 0) { lives = 0; running = false; soundGameOver(); showGameOver(); }
    }
  }
}

// ── called when a power-up balloon is popped ──
function activatePowerUp(type) {
  soundPowerUp(type);
  if (type === PU_FREEZE) {
    freezeTimer = 10;
    puBanner = { text: '❄  FREEZE!  All balloons frozen for 10s', colour: '#aaeeff', timer: 2.5 };
  } else if (type === PU_SPEED) {
    speedTimer = 10;
    puBanner = { text: '⚡  SPEED!  Hand moves faster for 10s', colour: '#ffee44', timer: 2.5 };
  } else if (type === PU_MULTIPIN) {
    multipinTimer = 10;
    // build 3 extra pins spaced to the right of the main pin
    extraPins = [1, 2, 3].map(i => ({
      x: pin.x + i * MULTIPIN_GAP,
      y: PIN_REST_Y,
      dropping:  false,
      returning: false,
    }));
    puBanner = { text: '📌  MULTI-PIN!  4 pins for 10s', colour: '#cc88ff', timer: 2.5 };
  }
}

// ═══════════════════════════════════════
//  COLOUR HELPERS
// ═══════════════════════════════════════
function hexRGB(h) {
  return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
}
function lighten(hex, a) {
  const [r,g,b] = hexRGB(hex);
  return `rgb(${Math.round(r+(255-r)*a)},${Math.round(g+(255-g)*a)},${Math.round(b+(255-b)*a)})`;
}
function darken(hex, a) {
  const [r,g,b] = hexRGB(hex);
  return `rgb(${Math.round(r*(1-a))},${Math.round(g*(1-a))},${Math.round(b*(1-a))})`;
}

// ═══════════════════════════════════════
//  PARTICLES
// ═══════════════════════════════════════
function spawnPopParticles(x, y, colour, isPowerUp) {
  const count = isPowerUp ? 22 : 14;
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = isPowerUp ? (3 + Math.random() * 6) : (2 + Math.random() * 4);
    particles.push({
      x, y,
      vx:      Math.cos(angle) * speed,
      vy:      Math.sin(angle) * speed - (Math.random() * 2),
      r:       isPowerUp ? (3 + Math.random() * 4) : (2 + Math.random() * 3),
      colour:  isPowerUp ? ['#fff','#ffee44','#aaeeff','#cc88ff'][Math.floor(Math.random()*4)] : colour,
      alpha:   1,
      decay:   0.025 + Math.random() * 0.02,
      spin:    (Math.random() - 0.5) * 0.3,
      angle:   Math.random() * Math.PI * 2,
      shape:   Math.random() < 0.5 ? 'circle' : 'rect',
      gravity: 0.12 + Math.random() * 0.08,
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x     += p.vx;
    p.y     += p.vy;
    p.vy    += p.gravity;
    p.vx    *= 0.97;
    p.angle += p.spin;
    p.alpha -= p.decay;
    if (p.alpha <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.alpha);
    ctx.fillStyle   = p.colour;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);
    if (p.shape === 'circle') {
      ctx.beginPath();
      ctx.arc(0, 0, p.r, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillRect(-p.r, -p.r * 0.5, p.r * 2, p.r);
    }
    ctx.restore();
  }
}

// ═══════════════════════════════════════
//  DRAW
// ═══════════════════════════════════════
function drawBackground() {
  // hue-shifting gradient — deepens and warms as waves increase
  const hue = bgHue % 360;
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, `hsl(${hue},     60%, 6%)`);
  grad.addColorStop(1, `hsl(${hue + 30},55%, 10%)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // subtle vignette
  const vig = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.85);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);

  // stars
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  for (let s = 0; s < 90; s++) {
    const sx = (s * 137 + 50) % W;
    const sy = (s * 97  + 30) % (H * 0.9);
    const twinkle = 0.3 + 0.7 * Math.abs(Math.sin(Date.now() * 0.001 + s));
    ctx.globalAlpha = twinkle * 0.6;
    ctx.beginPath();
    ctx.arc(sx, sy, 0.6 + (s % 3) * 0.4, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // floating decorative clouds (slow drift)
  const t = Date.now() * 0.00008;
  const clouds = [
    { x: (W * 0.15 + t * 40) % (W + 120) - 60, y: H * 0.65, r: 38, a: 0.04 },
    { x: (W * 0.55 + t * 28) % (W + 120) - 60, y: H * 0.78, r: 28, a: 0.03 },
    { x: (W * 0.80 + t * 52) % (W + 120) - 60, y: H * 0.55, r: 32, a: 0.035 },
  ];
  for (const c of clouds) {
    ctx.save();
    ctx.globalAlpha = c.a;
    ctx.fillStyle = '#ffffff';
    // puff of overlapping circles
    for (let i = 0; i < 5; i++) {
      ctx.beginPath();
      ctx.arc(c.x + i * c.r * 0.55, c.y + Math.sin(i * 1.2) * c.r * 0.2, c.r * (0.7 + i * 0.08), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}

// Draws the pin (head + shaft + tip) with its TIP at (x, y)
function drawPinAt(x, y) {
  ctx.save();
  ctx.translate(x, y);

  const HEAD_R  = 12;
  const SHAFT_L = 38;
  const SHAFT_W = 3.5;
  const TIP_L   = 10;

  const shaftBottom = -TIP_L;
  const shaftTop    = shaftBottom - SHAFT_L;
  const headY       = shaftTop - HEAD_R + 2;

  // tip
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(-SHAFT_W * 0.5, -TIP_L);
  ctx.lineTo( SHAFT_W * 0.5, -TIP_L);
  ctx.closePath();
  ctx.fillStyle = '#e8e8e8';
  ctx.fill();

  // shaft — metallic gradient
  ctx.beginPath();
  ctx.moveTo(-SHAFT_W * 0.5, shaftBottom);
  ctx.lineTo( SHAFT_W * 0.5, shaftBottom);
  ctx.lineTo( SHAFT_W,       shaftTop);
  ctx.lineTo(-SHAFT_W,       shaftTop);
  ctx.closePath();
  const sg = ctx.createLinearGradient(-SHAFT_W, 0, SHAFT_W * 2, 0);
  sg.addColorStop(0,   '#888');
  sg.addColorStop(0.4, '#eee');
  sg.addColorStop(0.6, '#fff');
  sg.addColorStop(1,   '#aaa');
  ctx.fillStyle = sg;
  ctx.fill();

  // head — pink glassy ball
  const hg = ctx.createRadialGradient(
    -HEAD_R * 0.3, headY - HEAD_R * 0.3, HEAD_R * 0.1,
    0, headY, HEAD_R
  );
  hg.addColorStop(0,   '#ffcce8');
  hg.addColorStop(0.5, '#ff3399');
  hg.addColorStop(1,   '#880033');
  ctx.beginPath();
  ctx.arc(0, headY, HEAD_R, 0, Math.PI * 2);
  ctx.fillStyle = hg;
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // sheen on head
  ctx.beginPath();
  ctx.ellipse(-HEAD_R * 0.3, headY - HEAD_R * 0.32, HEAD_R * 0.28, HEAD_R * 0.16, -0.4, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fill();

  ctx.restore();
}

function drawPin() {
  const tx = pin.x;
  const ty = pin.y;

  ctx.save();

  // top rail
  ctx.fillStyle = 'rgba(255,110,199,0.10)';
  ctx.fillRect(0, 0, W, 22);
  ctx.strokeStyle = multipinTimer > 0 ? 'rgba(180,100,255,0.7)' : 'rgba(255,110,199,0.45)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, 22); ctx.lineTo(W, 22); ctx.stroke();

  // dotted guide lines (only while resting)
  if (!pin.dropping && !pin.returning) {
    ctx.setLineDash([5, 9]);
    ctx.strokeStyle = 'rgba(255,110,199,0.18)';
    ctx.lineWidth = 1.5;
    // main pin guide
    ctx.beginPath(); ctx.moveTo(tx, ty + 4); ctx.lineTo(tx, H); ctx.stroke();
    // extra pin guides
    for (const ep of extraPins) {
      if (ep.x > 0 && ep.x < W) {
        ctx.beginPath(); ctx.moveTo(ep.x, PIN_REST_Y + 4); ctx.lineTo(ep.x, H); ctx.stroke();
      }
    }
    ctx.setLineDash([]);
  }

  ctx.restore();

  // speed glow on main pin head
  if (speedTimer > 0) {
    ctx.save();
    const HEAD_R = 12;
    const headY  = ty - 10 - 38 - HEAD_R + 2;
    ctx.beginPath();
    ctx.arc(tx, headY, HEAD_R * 2, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,230,50,0.25)';
    ctx.fill();
    ctx.restore();
  }

  // multipin glow across all pin heads
  if (multipinTimer > 0) {
    ctx.save();
    const HEAD_R = 12;
    const pulse  = 1 + 0.2 * Math.sin(Date.now() * 0.008);
    [pin, ...extraPins].forEach(p => {
      if (p.x < 0 || p.x > W) return;
      const headY = p.y - 10 - 38 - HEAD_R + 2;
      ctx.beginPath();
      ctx.arc(p.x, headY, HEAD_R * 2 * pulse, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(180,100,255,0.22)';
      ctx.fill();
    });
    ctx.restore();
  }

  // draw main pin
  drawPinAt(tx, ty);

  // draw extra pins (only during multipin power-up)
  for (const ep of extraPins) {
    if (ep.x > 0 && ep.x < W) drawPinAt(ep.x, ep.y);
  }
}

function drawBalloon(b) {
  ctx.save();
  ctx.translate(b.x, b.y);

  if (b.popping) {
    const p = b.popTimer / 0.28;
    ctx.globalAlpha = 1 - p;
    ctx.strokeStyle = b.colour;
    ctx.lineWidth = 3;
    for (let i = 0; i < 8; i++) {
      const a = (i/8)*Math.PI*2;
      const len = b.r*(0.5 + p*1.5);
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*b.r*0.15, Math.sin(a)*b.r*0.15);
      ctx.lineTo(Math.cos(a)*len, Math.sin(a)*len);
      ctx.stroke();
    }
    ctx.restore(); return;
  }

  // ── power-up outer glow ──
  if (b.powerUp) {
    const glowCol = b.powerUp === PU_FREEZE    ? 'rgba(100,220,255,0.35)'
                  : b.powerUp === PU_MULTIPIN  ? 'rgba(180,100,255,0.35)'
                  : 'rgba(255,230,50,0.35)';
    const pulse = 1 + 0.18 * Math.sin(Date.now() * 0.006);
    ctx.beginPath();
    ctx.ellipse(0, 0, b.r * pulse * 1.35, b.r * pulse * 1.35 * 1.15, 0, 0, Math.PI*2);
    ctx.fillStyle = glowCol;
    ctx.fill();
  }

  // body
  const grad = ctx.createRadialGradient(-b.r*0.3,-b.r*0.35,b.r*0.04, 0,0,b.r);
  grad.addColorStop(0,   lighten(b.colour, 0.55));
  grad.addColorStop(0.6, b.colour);
  grad.addColorStop(1,   darken(b.colour, 0.32));
  ctx.beginPath();
  ctx.ellipse(0, 0, b.r, b.r*1.15, 0, 0, Math.PI*2);
  ctx.fillStyle = grad;
  ctx.fill();

  // frozen overlay shimmer
  if (freezeTimer > 0 && !b.powerUp) {
    ctx.beginPath();
    ctx.ellipse(0, 0, b.r, b.r*1.15, 0, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(180,240,255,0.35)';
    ctx.fill();
    // ice crystal lines
    ctx.strokeStyle = 'rgba(180,240,255,0.6)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 6; i++) {
      const a = (i/6)*Math.PI*2;
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.lineTo(Math.cos(a)*b.r*0.7, Math.sin(a)*b.r*0.7);
      ctx.stroke();
    }
  }

  // sheen
  ctx.beginPath();
  ctx.ellipse(-b.r*0.28, -b.r*0.38, b.r*0.22, b.r*0.13, -0.5, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.38)';
  ctx.fill();

  // power-up icon on the balloon face
  if (b.powerUp) {
    ctx.font = `bold ${Math.round(b.r * 0.75)}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.powerUp === PU_FREEZE ? '❄' : b.powerUp === PU_MULTIPIN ? '📌' : '⚡', 0, -b.r*0.1);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
  }

  // knot
  const ky = b.r*1.15;
  ctx.beginPath(); ctx.arc(0, ky, 5, 0, Math.PI*2);
  ctx.fillStyle = darken(b.colour, 0.4); ctx.fill();

  // string
  ctx.beginPath();
  ctx.moveTo(0, ky+5);
  ctx.quadraticCurveTo(11, ky+28, 1, ky+52);
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1.5; ctx.stroke();

  ctx.restore();
}

function drawHUD() {
  // ── pulsing danger zone line ──
  const anyClose = balloons.some(b => !b.popping && b.y < DANGER_Y + 80);
  const pulse = anyClose ? (0.3 + 0.3 * Math.abs(Math.sin(Date.now() * 0.006))) : 0.12;
  ctx.save();
  ctx.strokeStyle = `rgba(255,60,60,${pulse})`;
  ctx.lineWidth = anyClose ? 2 : 1;
  ctx.setLineDash([8, 6]);
  ctx.beginPath(); ctx.moveTo(0, DANGER_Y); ctx.lineTo(W, DANGER_Y); ctx.stroke();
  ctx.setLineDash([]);
  // warning label when close
  if (anyClose) {
    ctx.fillStyle = `rgba(255,80,80,${pulse * 1.5})`;
    ctx.font = 'bold 11px Courier New';
    ctx.textAlign = 'right';
    ctx.fillText('⚠ DANGER', W - 16, DANGER_Y - 5);
    ctx.textAlign = 'left';
  }
  ctx.restore();

  // ── score (top right) ──
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ff6ec7';
  ctx.font = 'bold 22px Courier New';
  ctx.fillText(score, W - 16, 46);
  ctx.fillStyle = '#554';
  ctx.font = '11px Courier New';
  ctx.fillText('SCORE', W - 16, 60);
  ctx.textAlign = 'left';

  // ── wave (top centre) ──
  ctx.textAlign = 'center';
  ctx.fillStyle = '#aa88cc';
  ctx.font = 'bold 13px Courier New';
  ctx.fillText(`WAVE  ${wave}`, W/2, 42);
  ctx.textAlign = 'left';

  // ── lives (hearts, top left) ──
  ctx.font = '20px serif';
  for (let i = 0; i < MAX_LIVES; i++) {
    // last heart flashes when only 1 left
    const isLast = (lives === 1 && i === 0);
    const heartAlpha = isLast ? (0.5 + 0.5 * Math.abs(Math.sin(Date.now() * 0.008))) : 1;
    ctx.globalAlpha = i < lives ? heartAlpha : 0.2;
    ctx.fillStyle = i < lives ? '#ff4466' : '#333';
    ctx.fillText('♥', 16 + i * 26, 46);
  }
  ctx.globalAlpha = 1;

  // ── combo display ──
  if (combo >= 3) {
    const comboCol = combo >= 10 ? '#ff4444' : combo >= 6 ? '#ffaa00' : '#ffee44';
    const comboSize = Math.min(28, 14 + combo);
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = `bold ${comboSize}px Courier New`;
    ctx.fillStyle = comboCol;
    ctx.shadowColor = comboCol;
    ctx.shadowBlur = 12;
    ctx.fillText(`${combo}x COMBO!`, W / 2, H / 2 - 60);
    ctx.restore();
  }
  // floating combo number
  if (comboDisplay) {
    const a = Math.min(1, comboDisplay.timer * 2);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.font = 'bold 22px Courier New';
    ctx.fillStyle = '#ffee44';
    ctx.shadowColor = '#ffaa00';
    ctx.shadowBlur = 10;
    ctx.fillText(`${comboDisplay.val}x`, comboDisplay.x, comboDisplay.y);
    ctx.restore();
  }

  // ── active power-up timer bars ──
  let barY = H - 52;
  if (freezeTimer > 0) {
    const frac = freezeTimer / 10;
    ctx.fillStyle = '#223344';
    ctx.fillRect(16, barY, 180, 14);
    ctx.fillStyle = '#aaeeff';
    ctx.fillRect(16, barY, 180 * frac, 14);
    ctx.fillStyle = '#aaeeff';
    ctx.font = 'bold 11px Courier New';
    ctx.fillText(`❄ FREEZE  ${freezeTimer.toFixed(1)}s`, 22, barY + 11);
    barY -= 20;
  }
  if (speedTimer > 0) {
    const frac = speedTimer / 10;
    ctx.fillStyle = '#332200';
    ctx.fillRect(16, barY, 180, 14);
    ctx.fillStyle = '#ffee44';
    ctx.fillRect(16, barY, 180 * frac, 14);
    ctx.fillStyle = '#332200';
    ctx.font = 'bold 11px Courier New';
    ctx.fillText(`⚡ SPEED  ${speedTimer.toFixed(1)}s`, 22, barY + 11);
    barY -= 20;
  }
  if (multipinTimer > 0) {
    const frac = multipinTimer / 10;
    ctx.fillStyle = '#220033';
    ctx.fillRect(16, barY, 180, 14);
    ctx.fillStyle = '#cc88ff';
    ctx.fillRect(16, barY, 180 * frac, 14);
    ctx.fillStyle = '#220033';
    ctx.font = 'bold 11px Courier New';
    ctx.fillText(`📌 MULTI-PIN  ${multipinTimer.toFixed(1)}s`, 22, barY + 11);
  }

  // ── power-up flash banner ──
  if (puBanner) {
    const alpha = Math.min(1, puBanner.timer * 2);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(W/2 - 220, H/2 - 36, 440, 52);
    ctx.fillStyle = puBanner.colour;
    ctx.font = 'bold 20px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(puBanner.text, W/2, H/2 + 4);
    ctx.restore();
    ctx.textAlign = 'left';
  }

  // ── by line ──
  ctx.fillStyle = '#333';
  ctx.font = '11px Courier New';
  ctx.fillText('by Lil · ez-az.net', 16, H - 16);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#2a1030';
  ctx.fillText('← → move   ↓ fire', W - 16, H - 16);
  ctx.textAlign = 'left';

  // ── score popups ──
  for (const b of balloons) {
    if (!b.scorePopup) continue;
    const p = b.scorePopup.timer / 0.28;
    ctx.save();
    ctx.globalAlpha = 1 - p;
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('+' + b.scorePopup.val, b.x, b.y - b.r * p * 2);
    ctx.restore();
  }
  ctx.textAlign = 'left';
}

function draw() {
  // ── screen shake ──
  ctx.save();
  if (screenShake > 0) {
    const mag = screenShake * 10;
    ctx.translate(
      (Math.random() - 0.5) * mag,
      (Math.random() - 0.5) * mag
    );
  }

  drawBackground();
  for (const b of balloons) drawBalloon(b);
  drawParticles();
  drawPin();
  drawHUD();

  ctx.restore();
}

// ═══════════════════════════════════════
//  LOOP
// ═══════════════════════════════════════
function loop(timestamp) {
  if (!running) return;
  const dt = Math.min((timestamp - lastTime)/1000, 0.05);
  lastTime = timestamp;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

let bestScore = 0;

function showGameOver() {
  stopMusic();
  if (score > bestScore) bestScore = score;
  document.getElementById('finalScore').textContent = 'SCORE: ' + score;
  document.getElementById('finalWave').textContent  = 'YOU REACHED WAVE ' + wave;
  document.getElementById('bestScore').textContent  = score >= bestScore ? '🏆 NEW BEST!' : 'BEST: ' + bestScore;
  document.getElementById('gameOverScreen').classList.remove('hidden');
}

function startGame() {
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.add('hidden');
  balloons = [];
  particles    = [];
  screenShake  = 0;
  combo        = 0;
  comboTimer   = 0;
  comboDisplay = null;
  bgHue        = 260;
  spawnTimer   = 1.0;
  score        = 0;
  lives        = MAX_LIVES;
  wave         = 1;
  popsThisWave = 0;
  freezeTimer   = 0;
  speedTimer    = 0;
  multipinTimer = 0;
  extraPins     = [];
  puBanner      = null;
  pin.x = W/2; pin.y = PIN_REST_Y;
  pin.dropping = false; pin.returning = false;
  running  = true;
  lastTime = performance.now();
  music.tempo = 138;
  stopMusic();
  startMusic();
  requestAnimationFrame(loop);
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);

// static preview while on start screen — animated balloons drift up
const previewBalloons = Array.from({length: 6}, (_, i) => ({
  x: 80 + i * 110,
  y: H - 100 - i * 60,
  baseX: 80 + i * 110,
  r: 28 + (i % 3) * 8,
  colour: COLOURS[i % COLOURS.length],
  wobble: i * 1.1,
  wobbleSpeed: 0.8 + i * 0.1,
  wobbleAmp: 14,
  popping: false,
  popTimer: 0,
  powerUp: null,
}));

function animateStartScreen(timestamp) {
  if (running) return;
  const dt = 0.016;
  for (const b of previewBalloons) {
    b.wobble += b.wobbleSpeed * dt;
    b.y -= 28 * dt;
    b.x  = b.baseX + Math.sin(b.wobble) * b.wobbleAmp;
    if (b.y + b.r < 0) b.y = H + b.r;
  }
  drawBackground();
  for (const b of previewBalloons) drawBalloon(b);
  drawHUD();
  requestAnimationFrame(animateStartScreen);
}
requestAnimationFrame(animateStartScreen);
</script>
